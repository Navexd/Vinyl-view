# Cargo.toml Version final 25/03/2026
[package]
name = "backend"
version = "4.0.0"
edition = "2024"

[dependencies]
rspotify = { version = "0.12.0", features = ["env-file"] }
tokio = { version = "1", features = ["full", "fs"] }
warp = "0.3"
