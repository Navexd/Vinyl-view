<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>Vinyl View</title>
    <link rel="stylesheet" href="style.css" />
    <script src="lib/color-thief.umd.js"></script>
</head>
<body>

<div id="bg-container" class="effect-float">
    <div id="bg-layer1" class="bg-layer"></div>
    <div id="bg-layer2" class="bg-layer"></div>
</div>

<div id="player">
    <div id="cover-wrapper">
        <img id="cover-back" crossorigin="anonymous" alt="Cover" />
        <img id="cover-front" crossorigin="anonymous" alt="Cover" />
    </div>
    <div id="track-info">
        <div id="title">Titre en cours...</div>
        <div id="artist">Artiste</div>
        <div id="album">Album</div>
    </div>
</div>

<button id="styleBtn">Float</button>

<script src="app.js"></script>

</body>
</html>
